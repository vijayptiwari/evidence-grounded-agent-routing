name: Bug report
description: Report a reproducible defect in the implementation, schema, test, or documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include secrets, personal data, customer content, or unredacted production traces. Use the private security channel for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include commands and synthetic inputs only.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and relevant optional dependency versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted output
      render: shell
