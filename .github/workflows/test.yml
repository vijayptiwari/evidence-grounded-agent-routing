name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-reference-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  repository-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verification dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify schemas, examples, links, hygiene, and benchmark
        run: python scripts/verify.py --skip-tests

  optional-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tested optional integrations
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-optional-tested.txt
      - name: Run adapter compatibility tests
        run: PYTHONPATH=src python -m unittest tests/test_optional_integrations.py -v

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-test the wheel outside the checkout
        run: |
          python -m venv /tmp/egr-wheel
          /tmp/egr-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/egr-wheel/bin/egr route "Use the order agent to track my parcel" --explicit-agent order-agent --synthetic --output route.json
          /tmp/egr-wheel/bin/egr benchmark --output benchmark.json
          /tmp/egr-wheel/bin/python -c 'import json; assert json.load(open("route.json"))["decision"]["selected_agent_ids"] == ["order-agent"]; assert json.load(open("benchmark.json"))["test_cases"] == 30'
